<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        p{background-color: red;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: yellow;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h2>User Form</h2>

    <form>
        <label for="name">Name</label>
        <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
        >

        <label for="email">Email</label>
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
        >

        <button type="submit">Submit</button>
        <div id="response" style="margin-top: 20px; white-space: pre-wrap;"></div>
        <div id="error" style="margin-top: 20px; color: red; display: none;"></div>
    </form>
</div>
<script>
    const form = document.querySelector("form");
    const result = document.getElementById("response");
    const error = document.getElementById("error");

    form.addEventListener("submit", async function (event) {
        // Prevent the page from refreshing
        event.preventDefault();

        // Get input values
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        const userData = {
            name: name,
            email: email
        };

        try {
            const response = await fetch("http://localhost:8080/user",
                { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(userData) }); if (!response.ok) {
                throw new Error("API request failed"); }
            const data = await response.text();
            result.style.display = "block";
            result.textContent = data;
            error.style.display = "none";
        } catch (err) {
            error.style.display = "block";
            error.textContent = "Could not connect to the server.";
            result.style.display = "none";
        }

    });
</script>

</body>
</html>
